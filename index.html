<h1>🔬 دليل المذاكرة: مناهج البحث العلمي</h1>
<div class="sub">كل المحاضرات في صفحة واحدة • اضغط على أي بطاقة لتفتحها • ابحث بكلمة • ثم جرّب الامتحان</div>

<script>
const S=[
["أساسيات العلم والبحث","العلم نشاط منظم، والبحث العلمي أسلوبه العملي. ابدأ من هنا.",[
["العلم والمعرفة",`<b>العلم:</b> نشاط إنساني ديناميكي يشكل أحد فروع المعرفة، وهو المعرفة المنسقة التي تنشأ عن الملاحظة والتجريب لتحديد طبيعة وأسس ما يُدرس.<ul><li><b>طرق الحصول على المعرفة:</b> المصادفة، المحاولة والخطأ، مصادر السلطة والثقة، التقاليد والعقائد والقيم، الاستدلال العلمي.</li><li><b>مراحل تطور المعرفة:</b> الحسية ← التأملية ← الدينية ← العلمية.</li><li><b>خصائص المعرفة العلمية:</b> التراكمية، التنظيم، البحث عن الأسباب، الشمولية، التجريد، النظرة الموضوعية.</li></ul>`],
["أساسيات العلم وأهدافه وخصائصه وافتراضاته",`<ul><li><b>أساسيات العلم (7):</b> الحقائق، المفاهيم، التعميمات، المبادئ العلمية، النظريات والمنطق، الأسئلة، التصور الفكري للمفاهيم.</li><li><b>أهداف العلم (3):</b> الشرح والفهم، التنبؤ، الضبط والتحكم.</li><li><b>خصائص العلم (6):</b> الموضوعية، الوصف الكمي، أنه غير قطعي وغير نهائي، الدقة والتكامل، الاستعانة بالعلوم الأخرى، التراكمية.</li><li><b>افتراضات العلم (3):</b> الثبات، الحتمية، التشابه.</li></ul>`],
["أنواع التفكير الهادف",`<ul><li><b>الاستنباطي (القياسي):</b> انتقال من مقدمة أو أكثر (معرفة قديمة) إلى معرفة جديدة، ويتعامل مع النظريات كاحتمالات يمكن تأييدها أو نفيها.</li><li><b>الاستقرائي:</b> التحقق من صدق معرفة جزئية بالملاحظة والتجربة المتكررة لتعميم النتائج. هو صدق احتمالي وليس برهانًا، ويساعد على التنبؤ.<br>نوعان: <b>تام</b> (وسيلة إلى معرفة وليس غاية) و<b>حدسي</b> (ينقل من الملاحظة والتجربة إلى تكوين الفرض الذي يفسرهما).</li></ul>`],
["البحث العلمي: تعريفه وأهدافه وخصائصه",`<b>البحث العلمي:</b> أسلوب فكري واعٍ ومنظم يهدف لبحث الظواهر والمشاكل والتعرف على أسبابها وجوانبها واختبار العلاقات بينها والكشف عن حقائق محددة تُطرح كفرضيات أو تساؤلات.<br><b>منهج البحث:</b> طريقة منظمة تعتمد على الفرضيات وعلى قواعد وقوانين تهيمن على سير البحث وتفرض على الباحث التقيد بها.<ul><li><b>الأهداف (6):</b> الوصف، التنبؤ، التفسير، التقويم، الدحض، التثبت.</li><li><b>الخصائص (7):</b> عملية منظمة وهادفة، الأصالة، الإبداع، الأمانة العلمية، الموضوعية، الدقة، الاعتماد على الدليل بدلًا من المصدر.</li></ul>`],
["أنواع البحوث",`<b>التصنيفات الأربعة:</b> حسب دقتها وأسلوب المعالجة، حسب نوعيتها، حسب القائمين بها، حسب أسلوبها وطبيعة المشكلة.<ul><li><b>النظري (الأساسي):</b> أغلب الدراسات الأكاديمية، هدفه الفهم وتقديم تفسيرات نظرية.</li><li><b>التطبيقي:</b> في القطاعات الحكومية أو الأهلية، لمعالجة مشكلة وتمكين متخذي القرار.</li><li><b>الموجَّه:</b> في المجالات المهنية والمنظمات والمشكلات الاجتماعية، بقصد فهمها وتقييمها ومعالجتها والتنبؤ بها.</li></ul>`],
["مهارات الباحث ومصادر البحث",`<ul><li><b>المهارات (7):</b> الملاحظة، المقارنة، التصنيف، القياس والصياغة الكمية، الاستنتاج، التنبؤ، التجريب.</li><li><b>المصادر (9):</b> الأدبيات السابقة، المقالات المهنية، الأبحاث المتخصصة، الندوات والمؤتمرات، الإحصائيات والتقارير، الصعوبات التي تواجه الباحث وقدرته على الملاحظة، الرغبة في التقصي والازدياد المعرفي، تكليف الباحث من جهة أخرى، تأثير المشرف أو الزملاء.</li></ul>`],
["مشكلات البحث واستخدامات المكتبة",`<ul><li><b>مشكلات البحث (4):</b> تتعلق بموضوع البحث، بالباحث، بالمجتمع والعينة، بتصميم البحث وأدوات جمع المعلومات.</li><li><b>استخدامات المكتبة (7):</b> محتوياتها وتنظيمها، البحث فيها، تقنية المعلومات، مشكلات الباحث المبتدئ، قواعد ونظم الاستخدام، أساليب التوثيق (الاقتباس المباشر وغير المباشر)، الهوامش وطريقة كتابتها.</li></ul>`]
]],
["المشكلة والفروض والأهداف","قلب البحث: مشكلة محددة ← أسئلة ← فروض قابلة للاختبار.",[
["كيف نتعرف على مشكلة البحث؟ وكيف نختارها؟",`<b>مصادر التعرف:</b> تحديد المجال الذي يخص مستقبل الباحث، استشارة المتخصصين، الخبرة العلمية، حداثة الموضوع، العمل مع فريق، إعادة بحث سابق للتأكد من النتائج، توصيات الدراسات السابقة، وسائل الإعلام.<br><b>مؤشرات الاختيار الموفق (4):</b> عدم الإضرار بمصلحة عامة، عدم مخالفة مبدأ شرعي أو قيمة أو عرف، مشكلة قابلة للقياس، رغبة الباحث في الموضوع.<br><b>أخطاء شائعة (4):</b> مشكلة واسعة النطاق، أول مشكلة تخطر بالبال، المثالية الزائدة، الركاكة وعدم الوضوح.<div class="tip">فكرة جوهرية: البحث الذي يخلو من إشكالية محددة ليس جديرًا بصفة العلمية.</div>`],
["صياغة المشكلة ومعاييرها وأنواعها",`<ul><li><b>الصيغة التقريرية (اللفظية):</b> جملة خبرية، مثل: «علاقة الذكاء بالتحصيل الدراسي».</li><li><b>الصيغة الاستفهامية:</b> سؤال، مثل: «ما أثر الذكاء على التحصيل؟». هي المفضلة لأنها تبرز العلاقة بين المتغيرين وتحدد الهدف الرئيسي.</li></ul><b>المعايير:</b> محددة وواضحة بحيث يمكن حلها، تعبر عن علاقة بين متغيرين أو أكثر، بصيغة سؤال، قابلة للاختبار والتجريب.<br><b>أنواع المشكلات:</b> ملحة ومهمة (أولوية عالية)، غير ملحة وأقل أهمية (أولوية أقل)، ملحة لكن أهميتها متدنية أو العكس (تتحدى قدرة الفرد فيتخذ القرار في ترتيبها).`],
["الأسئلة والفروض: أهميتها",`<b>الأسئلة:</b> تساعد على التعرف على جوانب الموضوع، تنبّه لأسئلة يرغب الباحث في إجاباتها، تضع الدراسة على الطريق الصحيح، وهي إحدى لبنات البحث (متوسط أسئلة البحث 5 إلى 7).<br><b>أهمية الفروض:</b><ul><li>تزيد قدرة الباحث على فهم الظاهرة بتفسير العلاقات بين المتغيرات.</li><li>ترشد جمع البيانات ذات الصلة.</li><li>تحدد الأساليب والإجراءات المناسبة لاختبار الحل.</li><li>تقدم تفسيرات للأحداث وأسبابها.</li><li>تنظم النتائج وتقدمها بطريقة ذات معنى؛ فالفرض تفسير أولي يحتفظ بطابع التخمين حتى تتوفر الحقائق، وإن عارضته الأدلة يُرفض.</li><li>قد تستثير فروضًا أخرى وتفسيرات جديدة.</li></ul>`],
["صياغة الفروض: الإثبات والنفي (الصفري)",`<ul><li><b>الإثبات (الفرضية المباشرة):</b> تؤكد وجود علاقة سالبة أو موجبة بين متغيرين، وقد تكون متجهة عندما يملك الباحث أسبابًا لتوقع الاتجاه. مثال: مستوى القلق عند الأذكياء أعلى منه عند ذوي الذكاء المنخفض.</li><li><b>النفي (الفرضية الصفرية):</b> تنفي وجود علاقة أو فروق، لأن الباحث لا يعلم بوجودها مسبقًا. هي الأسهل لأنها أكثر تحديدًا فيمكن قياسها والتحقق من صدقها.</li></ul>`],
["اختبار الفروض (4 طرق)",`<ol><li><b>الحذف:</b> حصر كل العوامل ذات العلاقة، واختبارها عاملًا عاملًا، وحذف ما ثبت عدم تأثيره حتى نصل للعوامل الكبيرة التأثير. أبسط الطرق.</li><li><b>استنباط المترتبات:</b> التحقق بمعرفة القضايا التي تترتب على الفرض. مثال: من قرع جرس الباب؟ مباشر، وللتفسيرات العلمية غير مباشر.</li><li><b>التلازم النسبي:</b> طريقة استقرائية لإثبات أو نفي علاقة سببية بمقارنة ظاهرتين وتتبع تغيراتهما. مثال: ارتفاع معدل المواليد كلما انخفض دخل الأسرة.</li><li><b>الطرق الإحصائية:</b> أدوات واختبارات ومقاييس مناسبة.</li></ol><div class="tip">تُقبل الفروض إذا وجد الباحث دليلًا واقعيًا يتفق مع جميع مترتباتها. وإن ظهرت أدلة تعارضها وجب التخلي عنها ولو كانت مغرية.</div>`],
["معايير الفرضية الجيدة وأهدافها والمتغيرات",`<b>المعايير (9):</b> تقرر العلاقات المتوقعة، لها سبب قوي أو أساس نظري، موجزة، شاملة ومرتبطة بحقائق، قابلة للفحص والاختبار، الاعتماد على فروض متعددة، المعقولية والبعد عن العمومية، القدرة على تفسير الظاهرة، الاتساق والبساطة.<br><b>أهدافها:</b> المساعدة في تصميم البحث وتنفيذه، إيجاد جواب مؤقت لسؤال البحث، تسهيل التحليل الإحصائي.<br><b>أنواعها:</b> متجهة وغير متجهة، إحصائية، صفرية وغير صفرية.<br><b>المتغيرات:</b> مستقلة، تابعة، ثانوية وتجريدية ودخيلة. وتُعرَّف تعريفًا اصطلاحيًا وإجرائيًا.`],
["أهداف البحث وأهميته وحدوده ومحدداته",`<b>الأهداف:</b> محددة ويمكن قياسها، دقيقة وثيقة الصلة بالمشكلة، قابلة للتحقيق في ضوء الوقت والجهد.<br><b>الأهمية:</b> علمية وعملية.<br><b>الحدود:</b> زمانية، مكانية، موضوعية، العينة.<br><b>المحددات (القصور):</b> مصدره الباحث (ثقافته، انتماؤه، إنجازه)، أو المبحوثون، أو تصميم البحث (عينة ومجتمع، خلل أثناء التجربة).`]
]],
["كتابة البحث وتنظيمه","العنوان والمقدمة والتقسيمات والخاتمة والمراجع والتنظيم الشكلي.",[
["عنوان البحث: الشروط",`<ul><li>محدد ويتضمن أهم عناصر البحث، بعبارة مختصرة ولغة سهلة، يبدأ بالكلمات المحورية، ويعبر عن المتغيرات المستقلة والتابعة. <b>لا يزيد عن 15 كلمة.</b></li><li><b>الموضوعي:</b> يعبر عن المضمون دون زيادة أو نقصان، يعكس الإشكالية، يبرز الأهمية، ويفضل أن يبين نوع المنهج والأدوات.</li><li><b>الشكلي:</b> محدد ومركز بعيد عن التعميم والتطويل، واضح خالٍ من الغموض، مباشر. وإن كان الموضوع مبتكرًا جدًا يُضاف عنوان فرعي.</li></ul><div class="tip">المفهوم الخاطئ: «كلما كان العنوان كبيرًا وعامًا كان أجود». الصحيح العكس: كلما كان محددًا ومختصرًا كان أجود. ويُفضَّل أن يعكس علاقة بين متغيرين على الأقل.</div>عنوان الكتاب يميل إلى الإثارة التسويقية، أما عنوان البحث فمختصر وواضح.`],
["العنوان والأسلوب الإحصائي",`شكل صياغة العنوان يحدد التحليل المطلوب:<ul><li><b>وصفي</b> («ما الخصائص…؟») ← إحصاء وصفي (تكرارات ونسب).</li><li><b>علاقة</b> («العلاقة بين…») ← معاملات ارتباط.</li><li><b>أثر</b> («أثر… في…») ← تحليل انحدار.</li><li><b>فروق</b> («الفروق بين…») ← اختبارات متعددة (ز، ت، ف…).</li></ul>لا تصغ عنوانًا بمصطلح «أثر» إن كنت لا تعرف تحليل الانحدار. يجب التناسق بين العنوان والإحصاء وكامل الرسالة. الأسلوب الإحصائي أداة للإجابة عن التساؤلات.<br><b>ملاحظات:</b> أسئلة الاستمارة تخدم أسئلة الدراسة فقط، والتوصيات تدعمها نتيجة وصلت إليها، ولا تستخدم كلمات مترادفة (فاعلية/فعالية/أهمية) بل مصطلحًا واحدًا. ابتعد عن الزخرفة والإطارات الملونة، ووحّد نوع الخط وحجمه.`],
["المقدمة وعناصرها وتحديد المشكلة",`المقدمة هي الباب الرئيسي الذي ندخل منه إلى صلب الموضوع، تحفز على القراءة، وتقدم نوايا الكاتب والغاية والأسباب. وكثير من الباحثين يعتبرونها بمثابة الفصل الأول.<br><b>العناصر:</b><ul><li><b>الخلفية النظرية (أدب الموضوع):</b> الإطار النظري والدراسات الخاصة بالموضوع بإيجاز.</li><li><b>أهمية الموضوع</b> وانعكاساته.</li><li><b>استعراض الجهود السابقة:</b> ما فعله الآخرون، جوانب النقص والقصور، طول الفترة الزمنية، وأوجه تميز دراستك.</li></ul>استطلاع الدراسات السابقة مهم لتجنب الأخطاء والتكرار غير المفيد.`],
["التقسيمات (التاريخي والبنيوي)",`<ul><li><b>التبويب التاريخي:</b> تقسيم الموضوع حسب تطوره عبر التاريخ، سواء ظاهرة طبيعية أو إنسانية.</li><li><b>البنيوية:</b> رائجة في العلوم الإنسانية، تركز على دراسة «بنية» الموضوع بدراسة مكوناته ومبادئه والعلاقات بينها، ورصد روابطه الخارجية والداخلية وتفاعلاته.</li></ul>يمكن المزج بينهما وهو الأفضل. <b>التسلسل:</b> مقدمة ← باب ← فصل ← مبحث ← مطلب ← فرع ← خاتمة.`],
["الخاتمة والفرق بينها وبين الخلاصة",`<b>الخاتمة:</b> حصيلة البحث وتجسيد للنتائج النهائية، تقدم للقارئ بشكل مكثف نتائج البحث وما أسفر عنه من جديد وحلول الإشكالية وما يثيره من إشكاليات جديدة. مرتبطة بالمقدمة (تجيب عن فرضياتها وتساؤلاتها). وليست ترديدًا لما جاء في المتن بل ربط للعناصر واستخلاص للنتائج. والباحث النزيه يمارس فيها «نقدًا ذاتيًا» ليؤكد وعيه بمشاكل موضوعه.<br><b>الخلاصة:</b> تلخيص حرفي للدراسة، تستعمل لأغراض أخرى: مطلوبة من المجلات ومراكز جمع الرسائل الجامعية لتعريف القارئ بفحوى الدراسة.`],
["المصادر والمراجع وترتيبها وكتابة بياناتها",`<b>المصدر:</b> مؤلفات الشخصية موضوع البحث. <b>المرجع:</b> الدراسات التي كتبها آخرون عنها.<br>تشمل القائمة كل ما رُجع إليه وأُحيل عليه في الهوامش، وكل دراسة استفاد منها الباحث ولم يشر إليها. والأمانة تقتضي ألا يذكر مصدرًا لم يطلع عليه إيهامًا بسعة الاطلاع.<br><b>طرق الترتيب (4):</b> ألفبائي حسب أسماء المؤلفين، قسمان (مصادر ومراجع) كلٌّ أبجديًا، حسب الموضوعات ثم ألفبائيًا داخل كل تصنيف، حسب نوع المصدر (كتب، دوريات، متنوعات، مستندات، تقارير، أبحاث غير منشورة…). وإن تعددت اللغات تُذكر كل مجموعة مستقلة.<br><b>كتاب:</b> لقب المؤلف، اسمه الشخصي فاسم أبيه، اسم المرجع بخط أسود أو مائل أو تحته خط، رقم الطبعة، مكان النشر، الناشر، سنة النشر. مؤلف مجهول يُكتب «مجهول».<br><b>مقال:</b> المؤلف، عنوان المقال بين شولتين، اسم المجلة، رقم العدد، تاريخه بين قوسين، رقم الصفحات.<br><b>رسالة جامعية:</b> المؤلف، عنوان الرسالة، النوع (ماجستير أو دكتوراه)، منشورة أم لا، الجامعة، سنة الإجازة.<br>الأشيع وضع القائمة في نهاية البحث.`],
["الفهرس وتنظيم الرسالة",`<b>الفهرس:</b> بمثابة المرشد الجغرافي للقارئ، يرتب العناوين مع أرقام صفحاتها. موضعه أول الدراسة أو آخرها كلاهما جائز، والأفضل عمليًا في النهاية.<br><b>فصول الرسالة (5):</b><ol><li>خلفية الدراسة ومشكلتها (المشكلة، الأهمية، الأهداف، خلفية المشكلة، مخطط الدراسة، خلاصة الفصل).</li><li>الإطار النظري والدراسات السابقة (يُستحسن البدء بالأحدث لأنها تشمل الأقدم، ويُختم بخلاصة).</li><li>المنهجية والتصميم.</li><li>عرض النتائج.</li><li>الخلاصة والمناقشة والتوصيات.</li></ol><b>الصفحات التمهيدية:</b> الغلاف (العنوان بعبارة «رسالة مقدمة إلى قسم… استكمالًا لمتطلبات…»، اسم الطالب، المشرف)، حقوق النشر، الاعتماد، الإهداء، الشكر والعرفان، جدول المحتويات، فهرس الجداول والأشكال، الملاحق. تُرقَّم أبجديًا عدا الغلاف فلا يُرقَّم لكنه يُحسب.<br><div class="tip">لا تقل «قام الباحث» أو «توصل الباحث»، بل «توصلت الدراسة»، حفاظًا على الموضوعية والحيادية.</div>`],
["السياق والمجتمع والعينة",`<b>السياق:</b> البيئة التي تمت فيها الدراسة، ويجب وصفه كاملًا لأن النتائج تعتمد عليه.<br><b>مجتمع الدراسة:</b> المجتمع الذي تُسحب منه العينة (طلاب الجامعة مثلًا). من أهداف الباحث غير المعلنة تعميم النتائج عليه، لذلك يجب أن تكون العينة ممثلة له، وتكون <b>عشوائية</b>.<br><b>العينة:</b> جزء من المجتمع (ناس أو أشياء) تتعامل معهم الدراسة، وحدة التحليل فيها. يجب وصف كيفية اختيارها وخصائصها الديمغرافية (العمر، الجنس، الرتبة، الخبرة، نوع القطاع) لأنها تتيح المقارنات والكشف عن الفروق.`]
]],
["المنهج والقياس والعينات","كيف نختار المنهج؟ وكيف نقيس؟ ومن نختار؟",[
["أدبيات البحث: الإطار النظري والدراسات السابقة",`<b>فوائد الدراسات السابقة:</b> تحديد المشكلة بدقة، البحث عن طرق جديدة لدراستها، تفادي التكرار، الاستفادة من المنهجية، معرفة كيفية عرض الدراسات والإطار النظري. ثم الملخص والتعليق.<br><b>أخطاء الباحثين في الإطار النظري:</b> الاستعجال وعدم مراجعة كاملة، الاعتماد على المصادر الثانوية فقط، التركيز على النتائج دون غيرها، عدم الاطلاع على مصادر بلغات مختلفة، النقل والتوثيق الخاطئ، النقل دون إسهام الباحث، عدم البحث عن المترادفات (النمطية اللغوية).`],
["مناهج البحث: التعريف والاختيار",`<b>المنهج:</b> الطريقة التي يتبعها الباحث في إجراء دراسته، أي الإجراءات والأساليب والكيفية التي يتم بها البحث.<br><b>أسباب تعدد التصنيفات:</b> غياب اتفاق على مسمى واحد، البحث الواحد قد يتطلب أكثر من منهج، والبحث السلوكي معقد ومتداخل.<br><b>أسس اختيار المنهج:</b> صيغة التفكير (استقرائي/استنباطي)، زمن البحث (تاريخي/وصفي/تتبعي)، مكانه (حقلي/مسحي/دراسة حالة/مكتبي)، هدفه (وصفي/سببي/ارتباطي)، ضبط المتغيرات (تجريبي/شبه تجريبي)، إمكانية التطبيق (أساسي/تطبيقي)، طريقة التحليل (كمي/كيفي).<br><b>تجنب:</b> اتخاذ المنهج هدفًا (هو وسيلة فقط)، عدم التأكد من ملاءمته أو عدم الإلمام به، عدم القدرة على تعديله، عجزه عن توفير البيانات المطلوبة أو معالجتها.<br><b>تصنيف المناهج:</b> تجريبي وشبه تجريبي، حقلي، مسحي، تاريخي.`],
["المنهج التجريبي وشبه التجريبي",`أنواع التجارب: معملية، حقلية، وصفية.<br><b>تصميم التجربة:</b> اختيار التصميم، تحديد الحاجة لمجموعة ضابطة، هل يُسحب الأعضاء عشوائيًا، كيفية تحليل البيانات.<br><b>عند الاستخدام:</b> حدد التصميمات الممكنة والمحددات، واختر الأنسب للمشكلة. تصميم المتغير الواحد وتصميم المتغيرات المتعددة.`],
["القياس والتعريف الإجرائي",`<b>القياس:</b> عمليات تقرر نوع ودرجة شيء ما بتحديد أرقام مرتبطة رمزيًا بنوعه ودرجته. <b>البناء:</b> المفهوم النظري. <b>المتغير:</b> الصفة أو السمة. <b>التعريف الإجرائي:</b> كيف وبأي وسيلة تُقاس الظاهرة.<br><b>لماذا يكون التعريف الإجرائي غالبًا غير فعال؟</b> الاعتماد على تعريف واحد، لأنه لا يقيس إلا نفسه، ويعيق تحسين وتطوير القياس.<div class="tip">مستويات القياس (4): الاسمي، الرتبي، الفئوي، النسبي.</div>`],
["الصدق والثبات",`<b>الصدق:</b> إلى أي درجة يقيس المقياس ما صُمم له. أنواعه:<ol><li><b>التلازمي:</b> التمييز بين الأفراد المختلفين.</li><li><b>التنبؤي:</b> تحديد الفروق والاختلافات المستقبلية.</li><li><b>المحتوى:</b> مدى قياسه لخصائص الشيء المدروس.</li><li><b>البناء:</b> ارتباط البناء بأساسه النظري، وله نوعان: التقاربي والتمايزي.</li><li><b>الظاهري:</b> يقيس ما ينبغي قياسه (يحكّمه المحكّمون).</li></ol><b>الثبات:</b> درجة إعطاء المقياس قراءات متقاربة كل مرة. أنواعه: الاختبار القبلي والبعدي، الارتباط النصفي، متوسط الارتباط بين الجزء والكل، متوسط الارتباط بين الأجزاء.<div class="tip">المقياس الصادق غالبًا ثابت بدرجة مقبولة، لكن ثبات المقياس لا يعني صدقه.</div>`],
["أنواع المقاييس",`<ul><li><b>ثورستون:</b> أسئلة ومحكّمون ثم ترتيبها حسب القيم.</li><li><b>جوتمان:</b> عبارات متدرجة.</li><li><b>ليكرت:</b> مجموعة عبارات ومجموعة خيارات.</li><li><b>اختلاف المعنى:</b> يقيس إدراك الشخص للمفهوم (التقويم، القوة، النشاط) من 1 إلى 7، مثل اتجاهات الموظف نحو الرئيس.</li><li><b>المصفوفة الاجتماعية:</b> قياس الشعبية والانسجام بين الجماعات بأسئلة نعم/لا.</li></ul>`],
["المجتمع والعينات وأنواعها وحجمها",`<b>مثال المحاضرة:</b> المجتمع = موظفو الحكومة، مجتمع الدراسة = موظفو الوزارات، إطار العينة = الوزارات الخدمية، العينة = الموظفون الرجال، وحدة العينة = الموظف. المعلمة (للمجتمع) والإحصائية (للعينة). أخطاء العينة: الصدفة والتحيز.<br><b>غير الاحتمالية:</b> بالمصادفة، الحصصية، حكم الباحث.<br><b>الاحتمالية:</b> العشوائية البسيطة، المنتظمة، الطبقية، العنقودية.<br><b>تحديد الحجم:</b> الجداول الإحصائية أو المعادلة.<br><b>أدوات جمع البيانات:</b> التجربة، الاستبانة، المقابلة، الملاحظة.`]
]],
["البيانات والتحليل والعرض","من جمع البيانات إلى عرضها بأمانة.",[
["خطوات البحث العلمي",`البحث عمل متكامل: يبدأ بسؤال ← فكرة بحث ← مقترح ← تطبيق عملي وجمع بيانات ← تحليل ← عرض ومناقشة.<br><b>التسلسل:</b> التحديد المبدئي للمشكلة ← الدراسة الاستطلاعية ← التحديد النهائي ← خطة البحث ← البيانات الثانوية (داخلية وخارجية) والأولية ← تصميم البحث الميداني (المقياس، أسلوب الدراسة وتكلفتها) ← إجراء البحث الميداني وقياس الصدق والثبات ← جمع البيانات وترتيبها وترميزها وتحليلها ← النتائج ← التوصيات ← تطبيقها ← المتابعة.`],
["البيانات والمعلومات ومستويات النظم",`<b>البيانات:</b> حقائق خام قد تكون غير مترابطة وغير مجدية بصورتها، وتشبه المواد الخام اللازمة لمصنع. <b>المعلومات:</b> الناتج من معالجة البيانات بالطرق التحليلية والاستنتاجية.<br><b>تحليل المعلومات:</b> حصر وتسجيل وتحليل بيانات وحقائق عن مشكلة لتحديد حلول بديلة واختيار الأمثل.<br><b>مستويات نظم المعلومات (4):</b> مستوى العمليات (القاعدة)، المستوى المعرفي، المستوى الإداري (الإدارات الوسطى)، المستوى الإستراتيجي (الإدارات العليا).`],
["أساليب التحليل: الكمي والكيفي",`<ul><li><b>الكمي (العددي):</b> تفسير البيانات بالأعداد والأرقام والطرق الرياضية والإحصائية والرسوم. أدواته: الاستبيانات، المسح الإحصائي.</li><li><b>الكيفي (النوعي):</b> تحليل الأداء والمواقف واستخلاص نتائج عامة وفرضيات والتعبير عنها بكلمات. أدواته: المجموعة البؤرية، الملاحظة، المقابلة. يستخدمه كثيرون بسبب نوع الظاهرة وقلة البيانات ونوعية التدريب.</li></ul><b>خطوات تحليل المقابلات:</b> استمع للتسجيلات، جهّز موجزًا، حدد الألفاظ والأفكار والمواضيع المشتركة، حدد المعلومات الناقصة، وحدد ما يمكن الاستشهاد به.<br><b>الاستبيانات:</b> جدولة المعطيات الكمية وتلخيصها وتحويلها إلى مخططات، ثم تلخيص في جدول، تمثيل في رسم بياني، وتفسير.<br><b>قبل التحليل:</b> مراجعة البيانات لتلافي القصور والأخطاء والتأكد من وجود استجابات بنسبة معقولة.`],
["برامج التحليل وقاعدة البيانات",`<ul><li><b>Excel:</b> متوفر على أغلب الحواسيب وسهل إدخال المعطيات وتعديلها وجيد مع القوائم والإحصاءات الملخصة (المتوسط، الحد الأدنى والأعلى، الانحراف المعياري)، لكنه محدود في التحليل الإحصائي.</li><li><b>SPSS:</b> برنامج مخصص لتحليل المعطيات بوحدات برمجية، لكنه مكلف لأن كل وحدة تُشترى بمفردها.</li><li><b>Minitab:</b> يعمل على نظم Windows ويعطي التحليلات الوصفية والتقديرات واختبارات النسب.</li></ul><b>قاعدة البيانات:</b> الطريقة التي تُخزَّن بها بيانات الدراسة للوصول إليها لاحقًا للتحليل، مع الاستعانة بمتخصصي الإحصاء.<br><b>أسئلة التخزين الأربعة:</b> ما المعلومات التي ستُخزَّن؟ من يحتاجها ومتى؟ بأي شكل (نسخ خطية أم حاسوب)؟ قيّم احتياجاتك بانتظام وتخلص مما لا تحتاج.`],
["التحيز والتثليث وتحديات التحليل",`التحيز يؤثر في التحليل الكمي والنوعي. وسائل ضبطه:<ol><li><b>التثليث:</b> استخدام عدة طرائق ومصادر وأنواع بيانات ومنظورات للحصول على صورة أشمل.</li><li>اطلب من آخرين فحص الإجابات لتفادي تحيزك.</li><li>إشراك الجهات المعنية في تحليل البيانات وتفسيرها.</li><li>تدوين مذكرات وصفية مستمرة بالكلمات ذاتها وعدم السماح للأفكار الشخصية بالتدخل.</li></ol><b>موجهات:</b> لا تفرط في التعبير عن البيانات النوعية تعبيرًا كميًا (كوضع إجابات مجموعة التركيز في نسب مئوية بدلًا من استكشاف الأفكار والمواقف).`],
["كيف تختار طريقة التحليل؟",`وضّح ثلاثة جوانب: أوجه التباين والتداخل بين الطرائق النوعية والكمية، الآثار المترتبة على الطرائق الفردية أو الجماعية، وما يجعل الطريقة تشاركية أو يمنع ذلك.<br><b>خطوات أهمها:</b> تأكد أن جهة أخرى لم تجمع هذه البيانات، حدد مستوى الدقة المطلوب، استشر متخصصًا إن لزم، حدد المهمة (نوعية أو كمية، جمع أو تحليل)، قرر نطاق المشاركة والتغطية (عينة أم شاملة وحجمها)، أحصِ الخيارات واختر مبدئيًا، تأكد أنها معقولة ومناسبة وصحيحة وموثوقة وفعالة التكلفة وجيدة التوقيت، وجرّبها على عدد قليل من المشاركين ثم عدّلها.<br><b>عند الجمع:</b> اختر القائمين بالمقابلات بعناية، وزّع المهام للحد من الأخطاء، تأكد من إتقانهم للطرائق ووضوح اللغة وتجهيز المستلزمات.`],
["عرض البيانات: الجداول والرسوم والصور",`<b>طرق العرض:</b> الأشكال التوضيحية والجداول (الأكثر شيوعًا)، العرض الإنشائي (بجمل وعبارات)، العرض البياني.<ul><li><b>الجداول:</b> تنظم البيانات ويسهل تتبعها، وتصنَّف زمنيًا أو جغرافيًا أو كميًا أو نوعيًا. رتّب الصفوف والأعمدة بما يخدم الفكرة، ووحّد الشكل، واجمع الجداول إن أمكن، وقرّب الأرقام للدقة المناسبة (لا تكتب ثلاث خانات عشرية بلا داعٍ).</li><li><b>الرسوم البيانية:</b> الأعمدة، الدوائر النسبية، المربعات، المستطيلات، المدرج التكراري، المضلع، المنحنيات. استخدم رسومًا مبسطة، ولا تستخدم الأشكال ثلاثية الأبعاد لأنها لا تضيف شيئًا وتجعل المقارنة أصعب. تجنب ألوانًا يصعب تمييزها عند التصوير بالأبيض والأسود، واختر مقياس رسم لا يخفي التغيرات.</li><li><b>الصور:</b> لتوضيح ما لا تُظهره الرسوم، اجعلها واضحة وغير معقدة، وأحط الجزء المهم بدائرة.</li></ul><b>عمومًا:</b> الشكل مفهوم دون الرجوع للنص، اذكر المصدر إن نُقلت البيانات، يسبق الشرح الجدول أو الشكل، <b>وكن أمينًا</b> فلا تضلل القارئ ولا تُخفِ ما يضعف رأيك ولا تقرّب الأرقام لإخفاء معلومات.`]
]]

let tmr=null;

let order,ans,cur;
function startExam(){order=Q.map((_,i)=>i).sort(()=>Math.random()-.5);ans={};cur=0;const t=document.getElementById("tm").checked;if(t){let left=1200;clearInterval(tmr);tmr=setInterval(()=>{left--;const e=document.getElementById("clk");if(e)e.textContent="⏱ "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0){clearInterval(tmr);finish()}},1000)}render()}
function render(){const k=order[cur],q=Q[k];ex.innerHTML=`<div class="row"><span class="note">السؤال ${cur+1} من ${order.length}</span><span class="note" id="clk"></span></div><div class="bar"><i style="width:${cur/order.length*100}%"></i></div><div class="q"><b>${q[0]}</b>${q[1].map((o,i)=>`<button class="o${ans[k]===i?" sel":""}" onclick="pick(${k},${i})">${o}</button>`).join("")}</div><div class="row"><button class="btn" onclick="go(-1)"${cur?"":" disabled"}>السابق</button><button class="btn pri" onclick="go(1)">${cur==order.length-1?"إنهاء":"التالي"}</button></div>`}
function pick(k,i){ans[k]=i;render()}
function go(d){if(cur+d>=order.length){finish();return}cur=Math.max(0,cur+d);render()}
function finish(){clearInterval(tmr);let sc=0;order.forEach(k=>{if(ans[k]===Q[k][2])sc++});const p=Math.round(sc/order.length*100);ex.innerHTML=`<div class="intro"><div class="big">${sc} / ${order.length} (${p}%)</div>${p>=85?"ممتاز! أنت جاهز.":p>=60?"جيد، راجع الأسئلة الخاطئة أدناه.":"تحتاج مراجعة أكثر، ابدأ بالأخطاء أدناه ثم أعد المحاولة."}</div>`+order.map(k=>{const q=Q[k],ok=ans[k]===q[2];return `<div class="q"><b>${ok?"✅":"❌"} ${q[0]}</b>${q[1].map((o,i)=>`<div class="o ${i===q[2]?"ok":i===ans[k]?"no":""}">${o}</div>`).join("")}<div class="note">${q[3]}</div></div>`}).join("")+`<div class="row"><button class="btn pri" onclick="startExam()">إعادة الامتحان</button><button class="btn" onclick="menu()">القائمة</button></div>`}
let ci=0,flip=false;
